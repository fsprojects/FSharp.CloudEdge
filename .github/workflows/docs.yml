name: Docs

# Builds the Nacara site in site/ and publishes it to https://fsprojects.github.io/FSharp.CloudEdge/.
# GitHub Pages must be enabled once for the repository, with "GitHub Actions" as the source.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the site
        working-directory: site
        run: dotnet run --project site.fsproj --configuration Release -- build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
